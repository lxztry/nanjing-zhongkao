<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>南京中考闯关 🏆</title>
  <style>
/* 南京中考闯关App - 样式 */

/* ===== 基础样式 ===== */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

:root {
  --bg-primary: #0f172a;
  --bg-secondary: #1e293b;
  --bg-card: #334155;
  --text-primary: #f1f5f9;
  --text-secondary: #94a3b8;
  --accent: #6366f1;
  --accent-glow: rgba(99, 102, 241, 0.3);
  --success: #10b981;
  --success-glow: rgba(16, 185, 129, 0.3);
  --danger: #ef4444;
  --warning: #f59e0b;
}

body {
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  background: var(--bg-primary);
  color: var(--text-primary);
  min-height: 100vh;
  line-height: 1.6;
}

#app {
  max-width: 480px;
  margin: 0 auto;
  padding: 16px;
  padding-bottom: 80px;
}

/* ===== 首页样式 ===== */
.home-view {
  animation: fadeIn 0.3s ease;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

/* 状态栏 */
.status-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 16px;
  background: var(--bg-secondary);
  border-radius: 16px;
  margin-bottom: 16px;
}

.user-info {
  display: flex;
  align-items: center;
  gap: 12px;
}

.level-badge {
  background: linear-gradient(135deg, #6366f1, #8b5cf6);
  color: white;
  padding: 4px 12px;
  border-radius: 20px;
  font-weight: bold;
  font-size: 14px;
}

.user-name {
  font-weight: 600;
}

.streak-badge {
  background: var(--bg-card);
  padding: 6px 12px;
  border-radius: 20px;
  font-size: 14px;
  color: var(--text-secondary);
}

.streak-badge.active {
  background: linear-gradient(135deg, #f59e0b, #ef4444);
  color: white;
}

/* 经验条 */
.xp-bar {
  background: var(--bg-secondary);
  border-radius: 12px;
  padding: 16px;
  margin-bottom: 20px;
}

.xp-label {
  display: flex;
  justify-content: space-between;
  font-size: 13px;
  color: var(--text-secondary);
  margin-bottom: 8px;
}

.xp-track {
  height: 12px;
  background: var(--bg-card);
  border-radius: 6px;
  overflow: hidden;
}

.xp-fill {
  height: 100%;
  background: linear-gradient(90deg, #6366f1, #8b5cf6);
  border-radius: 6px;
  transition: width 0.5s ease;
  box-shadow: 0 0 10px var(--accent-glow);
}

/* 统计卡片 */
.stats-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
  margin-bottom: 24px;
}

.stat-card {
  background: var(--bg-secondary);
  border-radius: 16px;
  padding: 16px;
  text-align: center;
  transition: transform 0.2s;
}

.stat-card:hover {
  transform: translateY(-2px);
}

.stat-icon {
  font-size: 28px;
  margin-bottom: 8px;
}

.stat-value {
  font-size: 24px;
  font-weight: bold;
  color: var(--text-primary);
}

.stat-label {
  font-size: 12px;
  color: var(--text-secondary);
}

/* 区域标题 */
.section {
  margin-bottom: 24px;
}

.section-title {
  font-size: 16px;
  font-weight: 600;
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.quest-count {
  background: var(--accent);
  color: white;
  padding: 2px 8px;
  border-radius: 10px;
  font-size: 12px;
}

/* 薄弱点列表 */
.weak-list {
  background: var(--bg-secondary);
  border-radius: 12px;
  overflow: hidden;
}

.weak-item {
  display: flex;
  align-items: center;
  padding: 12px 16px;
  border-bottom: 1px solid var(--bg-card);
  cursor: pointer;
  transition: background 0.2s;
}

.weak-item:last-child {
  border-bottom: none;
}

.weak-item:hover {
  background: var(--bg-card);
}

.weak-icon {
  font-size: 20px;
  margin-right: 12px;
}

.weak-name {
  flex: 1;
  font-size: 14px;
}

.weak-rate {
  background: var(--danger);
  color: white;
  padding: 2px 8px;
  border-radius: 10px;
  font-size: 12px;
}

/* 任务列表 */
.quest-list {
  background: var(--bg-secondary);
  border-radius: 12px;
  overflow: hidden;
}

.quest-item {
  display: flex;
  align-items: center;
  padding: 14px 16px;
  border-bottom: 1px solid var(--bg-card);
  cursor: pointer;
  transition: background 0.2s;
}

.quest-item:last-child {
  border-bottom: none;
}

.quest-item:hover {
  background: var(--bg-card);
}

.quest-item.completed {
  opacity: 0.6;
}

.quest-icon {
  font-size: 24px;
  margin-right: 12px;
}

.quest-info {
  flex: 1;
}

.quest-title {
  font-weight: 600;
  font-size: 14px;
}

.quest-desc {
  font-size: 12px;
  color: var(--text-secondary);
  margin: 4px 0;
}

.quest-progress-bar {
  height: 4px;
  background: var(--bg-primary);
  border-radius: 2px;
  overflow: hidden;
  margin-top: 6px;
}

.quest-progress-fill {
  height: 100%;
  background: var(--success);
  border-radius: 2px;
  transition: width 0.3s ease;
}

.quest-xp {
  background: var(--accent);
  color: white;
  padding: 4px 10px;
  border-radius: 12px;
  font-size: 12px;
  font-weight: 600;
}

/* 科目网格 */
.subject-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
}

.subject-card {
  background: var(--bg-secondary);
  border-radius: 16px;
  padding: 20px 12px;
  text-align: center;
  cursor: pointer;
  transition: all 0.3s ease;
  border: 2px solid transparent;
}

.subject-card:hover {
  transform: translateY(-4px);
  border-color: var(--card-color);
  box-shadow: 0 8px 20px rgba(0,0,0,0.3);
}

.subject-icon {
  font-size: 36px;
  margin-bottom: 8px;
}

.subject-name {
  font-weight: 600;
  font-size: 14px;
  margin-bottom: 4px;
}

.subject-topics {
  font-size: 11px;
  color: var(--text-secondary);
}

/* 底部导航 */
.bottom-nav {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--bg-secondary);
  display: flex;
  justify-content: space-around;
  padding: 12px 0;
  border-top: 1px solid var(--bg-card);
  max-width: 480px;
  margin: 0 auto;
}

.nav-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  cursor: pointer;
  padding: 8px 16px;
  border-radius: 12px;
  transition: all 0.2s;
  color: var(--text-secondary);
}

.nav-item.active {
  color: var(--accent);
  background: rgba(99, 102, 241, 0.1);
}

.nav-icon {
  font-size: 22px;
}

.nav-label {
  font-size: 11px;
}

/* ===== 题目页面 ===== */
.quiz-view {
  animation: fadeIn 0.3s ease;
}

.quiz-header {
  background: var(--bg-secondary);
  border-radius: 12px;
  padding: 16px;
  margin-bottom: 20px;
}

.quiz-progress-info {
  display: flex;
  justify-content: space-between;
  font-size: 14px;
  margin-bottom: 8px;
}

.quiz-score {
  color: var(--success);
  font-weight: 600;
}

.quiz-progress-bar {
  height: 6px;
  background: var(--bg-card);
  border-radius: 3px;
  overflow: hidden;
}

.quiz-progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--accent), #8b5cf6);
  border-radius: 3px;
  transition: width 0.3s ease;
}

/* 题目容器 */
.question-container {
  background: var(--bg-secondary);
  border-radius: 16px;
  padding: 20px;
  margin-bottom: 20px;
}

.question-type-badge {
  display: inline-block;
  background: var(--accent);
  color: white;
  padding: 4px 12px;
  border-radius: 20px;
  font-size: 12px;
  margin-bottom: 16px;
}

.question-text {
  font-size: 18px;
  font-weight: 500;
  line-height: 1.7;
  margin-bottom: 24px;
}

/* 选项列表 */
.options-list {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.option-item {
  display: flex;
  align-items: center;
  background: var(--bg-card);
  padding: 14px 16px;
  border-radius: 12px;
  cursor: pointer;
  transition: all 0.2s;
  border: 2px solid transparent;
}

.option-item:hover {
  border-color: var(--accent);
  transform: translateX(4px);
}

.option-item.correct-option {
  background: var(--success);
  border-color: var(--success);
}

.option-item.wrong-option {
  background: var(--danger);
  border-color: var(--danger);
}

.option-letter {
  width: 32px;
  height: 32px;
  background: var(--bg-secondary);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: bold;
  margin-right: 12px;
  flex-shrink: 0;
}

.option-text {
  font-size: 15px;
}

/* 填空题输入 */
.input-area {
  display: flex;
  gap: 12px;
}

.answer-input {
  flex: 1;
  background: var(--bg-card);
  border: 2px solid var(--bg-card);
  border-radius: 12px;
  padding: 14px 16px;
  font-size: 16px;
  color: var(--text-primary);
  outline: none;
  transition: border-color 0.2s;
}

.answer-input:focus {
  border-color: var(--accent);
}

.submit-btn {
  background: var(--accent);
  color: white;
  border: none;
  padding: 14px 24px;
  border-radius: 12px;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  transition: transform 0.2s;
}

.submit-btn:hover {
  transform: scale(1.05);
}

/* 结果区域 */
.result-area {
  margin-top: 16px;
}

.result-card {
  background: var(--bg-secondary);
  border-radius: 16px;
  padding: 24px;
  text-align: center;
  animation: slideUp 0.3s ease;
}

@keyframes slideUp {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

.result-card.correct {
  border: 2px solid var(--success);
}

.result-card.wrong {
  border: 2px solid var(--danger);
}

.result-icon {
  font-size: 48px;
  margin-bottom: 12px;
}

.result-text {
  font-size: 20px;
  font-weight: bold;
  margin-bottom: 16px;
}

.result-card.correct .result-text {
  color: var(--success);
}

.result-card.wrong .result-text {
  color: var(--danger);
}

.answer-compare {
  background: var(--bg-card);
  padding: 12px;
  border-radius: 8px;
  margin-bottom: 16px;
  text-align: left;
}

.your-answer {
  color: var(--danger);
  font-size: 14px;
  margin-bottom: 8px;
}

.correct-answer {
  color: var(--success);
  font-size: 14px;
}

.explanation {
  background: var(--bg-card);
  padding: 12px;
  border-radius: 8px;
  text-align: left;
  font-size: 14px;
  line-height: 1.6;
  margin-bottom: 20px;
  color: var(--text-secondary);
}

.explanation strong {
  color: var(--text-primary);
}

.next-btn {
  background: var(--accent);
  color: white;
  border: none;
  padding: 14px 32px;
  border-radius: 12px;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
  transition: transform 0.2s;
}

.next-btn:hover {
  transform: scale(1.05);
}

/* ===== 结果页面 ===== */
.result-view {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 70vh;
  animation: fadeIn 0.3s ease;
}

.result-summary {
  text-align: center;
  margin-bottom: 32px;
}

.result-grade {
  font-size: 80px;
  margin-bottom: 16px;
}

.result-summary h2 {
  font-size: 24px;
  margin-bottom: 24px;
}

.result-stats {
  display: flex;
  gap: 24px;
}

.result-stat {
  text-align: center;
}

.result-stat .stat-value {
  display: block;
  font-size: 28px;
  font-weight: bold;
  color: var(--accent);
}

.result-stat .stat-label {
  font-size: 12px;
  color: var(--text-secondary);
}

.result-actions {
  display: flex;
  gap: 16px;
}

.action-btn {
  padding: 14px 28px;
  border-radius: 12px;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  transition: transform 0.2s;
}

.action-btn:hover {
  transform: scale(1.05);
}

.action-btn.primary {
  background: var(--accent);
  color: white;
  border: none;
}

.action-btn.secondary {
  background: transparent;
  color: var(--accent);
  border: 2px solid var(--accent);
}

/* ===== 专题选择页面 ===== */
.topics-view {
  animation: fadeIn 0.3s ease;
}

.view-header {
  display: flex;
  align-items: center;
  gap: 16px;
  margin-bottom: 24px;
}

.back-btn {
  background: var(--bg-secondary);
  border: none;
  color: var(--text-primary);
  padding: 8px 16px;
  border-radius: 8px;
  cursor: pointer;
  transition: background 0.2s;
}

.back-btn:hover {
  background: var(--bg-card);
}

.view-header h2 {
  font-size: 20px;
}

.topic-list {
  background: var(--bg-secondary);
  border-radius: 16px;
  overflow: hidden;
}

.topic-item {
  display: flex;
  align-items: center;
  padding: 16px;
  border-bottom: 1px solid var(--bg-card);
  cursor: pointer;
  transition: background 0.2s;
}

.topic-item:last-child {
  border-bottom: none;
}

.topic-item:hover {
  background: var(--bg-card);
}

.topic-icon {
  width: 48px;
  height: 48px;
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 24px;
  margin-right: 16px;
}

.topic-info {
  flex: 1;
}

.topic-name {
  font-weight: 600;
  font-size: 15px;
  margin-bottom: 4px;
}

.topic-count {
  font-size: 12px;
  color: var(--text-secondary);
}

.topic-arrow {
  color: var(--text-secondary);
  font-size: 18px;
}

/* ===== 进度页面 ===== */
.progress-view {
  animation: fadeIn 0.3s ease;
}

.progress-summary {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
  margin-bottom: 24px;
}

.progress-card {
  background: var(--bg-secondary);
  border-radius: 16px;
  padding: 16px;
  text-align: center;
  display: flex;
  flex-direction: column;
  align-items: center;
}

.progress-icon {
  font-size: 28px;
  margin-bottom: 8px;
}

.progress-value {
  font-size: 24px;
  font-weight: bold;
}

.progress-label {
  font-size: 11px;
  color: var(--text-secondary);
}

.level-section {
  background: var(--bg-secondary);
  border-radius: 16px;
  padding: 20px;
  margin-bottom: 24px;
}

.level-section h3 {
  font-size: 16px;
  margin-bottom: 16px;
}

.level-info {
  display: flex;
  justify-content: space-between;
  font-size: 14px;
  margin-bottom: 8px;
}

.level-bar {
  height: 12px;
  background: var(--bg-card);
  border-radius: 6px;
  overflow: hidden;
  margin-bottom: 8px;
}

.level-fill {
  height: 100%;
  background: linear-gradient(90deg, #6366f1, #8b5cf6);
  border-radius: 6px;
  transition: width 0.5s ease;
}

.level-next {
  font-size: 12px;
  color: var(--text-secondary);
  text-align: center;
}

.subject-progress {
  background: var(--bg-secondary);
  border-radius: 16px;
  padding: 20px;
  margin-bottom: 24px;
}

.subject-progress h3 {
  font-size: 16px;
  margin-bottom: 16px;
}

.subject-progress-item {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 12px;
}

.subject-progress-item:last-child {
  margin-bottom: 0;
}

.subject-progress-info {
  display: flex;
  align-items: center;
  gap: 8px;
  width: 80px;
}

.subject-progress-info .subject-icon {
  font-size: 18px;
}

.subject-progress-info .subject-name {
  font-size: 13px;
}

.subject-progress-bar {
  flex: 1;
  height: 8px;
  background: var(--bg-card);
  border-radius: 4px;
  overflow: hidden;
}

.subject-progress-fill {
  height: 100%;
  border-radius: 4px;
  transition: width 0.5s ease;
}

.subject-progress-value {
  font-size: 13px;
  font-weight: 600;
  width: 40px;
  text-align: right;
}

.back-home-btn {
  display: block;
  width: 100%;
  background: var(--accent);
  color: white;
  border: none;
  padding: 14px;
  border-radius: 12px;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  transition: transform 0.2s;
}

.back-home-btn:hover {
  transform: scale(1.02);
}

/* ===== 成就页面 ===== */
.achievements-view {
  animation: fadeIn 0.3s ease;
}

.achievements-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
  margin-bottom: 24px;
}

.achievement-card {
  background: var(--bg-secondary);
  border-radius: 16px;
  padding: 20px;
  text-align: center;
  border: 2px solid transparent;
  transition: all 0.3s ease;
}

.achievement-card.unlocked {
  border-color: var(--warning);
  box-shadow: 0 0 20px rgba(245, 158, 11, 0.2);
}

.achievement-card.locked {
  opacity: 0.5;
}

.achievement-icon {
  font-size: 40px;
  margin-bottom: 12px;
}

.achievement-name {
  font-weight: 600;
  font-size: 14px;
  margin-bottom: 4px;
}

.achievement-desc {
  font-size: 11px;
  color: var(--text-secondary);
  margin-bottom: 8px;
}

.achievement-badge {
  background: var(--warning);
  color: white;
  padding: 2px 10px;
  border-radius: 10px;
  font-size: 11px;
  font-weight: 600;
}

.achievement-condition {
  font-size: 11px;
  color: var(--text-secondary);
}

/* ===== 错题本页面 ===== */
.wrongbook-view {
  animation: fadeIn 0.3s ease;
}

.empty-state {
  text-align: center;
  padding: 60px 20px;
}

.empty-icon {
  font-size: 60px;
  margin-bottom: 16px;
}

.empty-text {
  font-size: 16px;
  color: var(--text-secondary);
}

.wrong-list {
  background: var(--bg-secondary);
  border-radius: 16px;
  overflow: hidden;
  margin-bottom: 24px;
}

.wrong-item {
  padding: 16px;
  border-bottom: 1px solid var(--bg-card);
}

.wrong-item:last-child {
  border-bottom: none;
}

.wrong-question {
  font-size: 14px;
  margin-bottom: 12px;
  line-height: 1.5;
}

.wrong-answer {
  background: var(--bg-card);
  padding: 10px;
  border-radius: 8px;
  margin-bottom: 8px;
}

.wrong-label {
  color: var(--text-secondary);
  font-size: 12px;
}

.wrong-value {
  color: var(--success);
  font-size: 13px;
  font-weight: 600;
}

.wrong-times {
  font-size: 11px;
  color: var(--danger);
  margin-bottom: 8px;
}

.review-btn {
  background: var(--accent);
  color: white;
  border: none;
  padding: 8px 16px;
  border-radius: 8px;
  font-size: 12px;
  cursor: pointer;
  transition: transform 0.2s;
}

.review-btn:hover {
  transform: scale(1.05);
}

/* ===== 提示 ===== */
.toast {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  background: var(--bg-card);
  color: var(--text-primary);
  padding: 12px 24px;
  border-radius: 12px;
  font-size: 14px;
  z-index: 1000;
  animation: fadeIn 0.2s ease;
  box-shadow: 0 10px 30px rgba(0,0,0,0.5);
}

.achievement-toast {
  position: fixed;
  top: 20px;
  left: 50%;
  transform: translateX(-50%);
  background: linear-gradient(135deg, #f59e0b, #ef4444);
  color: white;
  padding: 16px 24px;
  border-radius: 16px;
  display: flex;
  align-items: center;
  gap: 12px;
  z-index: 1000;
  animation: slideDown 0.3s ease;
  box-shadow: 0 10px 30px rgba(0,0,0,0.5);
}

@keyframes slideDown {
  from { opacity: 0; transform: translate(-50%, -30px); }
  to { opacity: 1; transform: translate(-50%, 0); }

// 游戏状态管理
const GameState = {
  // 玩家数据
  player: {
    name: '考生',
    level: 1,
    xp: 0,
    xpToNextLevel: 100,
    streak: 0,
    totalAnswered: 0,
    correctAnswers: 0,
    lastPlayDate: null
  },

  // 每日任务
  dailyQuests: [],

  // 闯关进度
  progress: {},

  // 错题本
  wrongAnswers: [],

  // 成就
  achievements: {},

  // 初始化
  init() {
    this.load();
    this.checkDailyReset();
    this.generateDailyQuests();
  },

  // 加载存档
  load() {
    const saved = localStorage.getItem('njzk_player');
    if (saved) {
      const data = JSON.parse(saved);
      this.player = { ...this.player, ...data.player };
      this.progress = data.progress || {};
      this.wrongAnswers = data.wrongAnswers || [];
      this.achievements = data.achievements || {};
    }
  },

  // 保存存档
  save() {
    const data = {
      player: this.player,
      progress: this.progress,
      wrongAnswers: this.wrongAnswers,
      achievements: this.achievements
    };
    localStorage.setItem('njzk_player', JSON.stringify(data));
  },

  // 检查是否需要重置每日任务
  checkDailyReset() {
    const today = new Date().toDateString();
    if (this.player.lastPlayDate !== today) {
      if (this.player.lastPlayDate) {
        const lastDate = new Date(this.player.lastPlayDate);
        const todayDate = new Date(today);
        const diffDays = Math.floor((todayDate - lastDate) / (1000 * 60 * 60 * 24));
        
        if (diffDays === 1) {
          this.player.streak += 1;
        } else if (diffDays > 1) {
          this.player.streak = 0;
        }
      }
      this.player.lastPlayDate = today;
      this.generateDailyQuests();
      this.save();
    }
  },

  // 生成每日任务
  generateDailyQuests() {
    const subjects = ['chemistry', 'math', 'chinese', 'english', 'physics', 'politics', 'history'];
    const questTypes = ['daily', 'challenge', 'review'];
    
    this.dailyQuests = [
      {
        id: 'q1',
        type: 'daily',
        subject: subjects[Math.floor(Math.random() * subjects.length)],
        title: '选择题练习',
        description: '完成5道选择题',
        target: 5,
        progress: 0,
        xp: 15,
        completed: false
      },
      {
        id: 'q2',
        type: 'daily',
        subject: subjects[Math.floor(Math.random() * subjects.length)],
        title: '综合挑战',
        description: '完成3道解答题',
        target: 3,
        progress: 0,
        xp: 25,
        completed: false
      },
      {
        id: 'q3',
        type: 'challenge',
        subject: 'random',
        title: '随机挑战',
        description: '随机抽取3道题',
        target: 3,
        progress: 0,
        xp: 20,
        completed: false
      },
      {
        id: 'q4',
        type: 'review',
        subject: 'wrong',
        title: '错题复习',
        description: '复习2道错题',
        target: 2,
        progress: 0,
        xp: 10,
        completed: false
      }
    ];

    // 恢复已完成的进度
    this.dailyQuests.forEach(quest => {
      const key = `daily_${quest.id}_${new Date().toDateString()}`;
      const saved = localStorage.getItem(key);
      if (saved) {
        const data = JSON.parse(saved);
        quest.progress = data.progress;
        quest.completed = data.completed;
      }
    });
  },

  // 更新任务进度
  updateQuestProgress(questId, delta) {
    const quest = this.dailyQuests.find(q => q.id === questId);
    if (quest && !quest.completed) {
      quest.progress = Math.min(quest.progress + delta, quest.target);
      if (quest.progress >= quest.target) {
        quest.completed = true;
        this.addXP(quest.xp);
      }
      
      const key = `daily_${quest.id}_${new Date().toDateString()}`;
      localStorage.setItem(key, JSON.stringify({
        progress: quest.progress,
        completed: quest.completed
      }));
      
      this.checkAchievements();
      this.save();
      return quest;
    }
    return null;
  },

  // 添加经验值
  addXP(amount) {
    this.player.xp += amount;
    while (this.player.xp >= this.player.xpToNextLevel) {
      this.player.xp -= this.player.xpToNextLevel;
      this.player.level += 1;
      this.player.xpToNextLevel = Math.floor(this.player.xpToNextLevel * 1.5);
    }
    this.checkAchievements();
    this.save();
  },

  // 记录答题结果
  recordAnswer(questionId, correct) {
    this.player.totalAnswered += 1;
    if (correct) {
      this.player.correctAnswers += 1;
    } else {
      // 添加到错题本
      if (!this.wrongAnswers.find(w => w.id === questionId)) {
        this.wrongAnswers.push({
          id: questionId,
          wrongCount: 1,
          lastWrong: new Date().toISOString()
        });
      } else {
        const record = this.wrongAnswers.find(w => w.id === questionId);
        record.wrongCount += 1;
        record.lastWrong = new Date().toISOString();
      }
    }
    this.save();
  },

  // 获取正确率
  getAccuracy() {
    if (this.player.totalAnswered === 0) return 0;
    return Math.round((this.player.correctAnswers / this.player.totalAnswered) * 100);
  },

  // 检查成就
  checkAchievements() {
    const ach = this.achievements;
    
    // 首次登录
    if (!ach.firstLogin) {
      ach.firstLogin = true;
      this.showAchievement('firstLogin', '首次登录', '🎉 打开应用，开启学习之旅！');
    }

    // 连续打卡
    if (this.player.streak >= 7 && !ach.streak7) {
      ach.streak7 = true;
      this.showAchievement('streak7', '坚持一周', '🔥 连续7天打卡！');
    }
    if (this.player.streak >= 30 && !ach.streak30) {
      ach.streak30 = true;
      this.showAchievement('streak30', '坚持一个月', '💎 连续30天打卡！');
    }

    // 答题数量
    if (this.player.totalAnswered >= 100 && !ach.answer100) {
      ach.answer100 = true;
      this.showAchievement('answer100', '初露锋芒', '📝 完成100道题目！');
    }
    if (this.player.totalAnswered >= 500 && !ach.answer500) {
      ach.answer500 = true;
      this.showAchievement('answer500', '题海无涯', '📚 完成500道题目！');
    }

    // 正确率
    if (this.player.totalAnswered >= 50 && this.getAccuracy() >= 80 && !ach.accuracy80) {
      ach.accuracy80 = true;
      this.showAchievement('accuracy80', '学有小成', '🎯 正确率达到80%！');
    }

    // 等级
    if (this.player.level >= 5 && !ach.level5) {
      ach.level5 = true;
      this.showAchievement('level5', '初学者', '⭐ 达到5级！');
    }
    if (this.player.level >= 10 && !ach.level10) {
      ach.level10 = true;
      this.showAchievement('level10', '进阶者', '🌟 达到10级！');
    }
  },

  // 显示成就弹窗
  showAchievement(id, name, desc) {
    const event = new CustomEvent('achievement', { detail: { id, name, desc } });
    window.dispatchEvent(event);
  },

  // 获取本周统计数据
  getWeeklyStats() {
    return {
      level: this.player.level,
      xp: this.player.xp,
      xpToNext: this.player.xpToNextLevel,
      streak: this.player.streak,
      totalAnswered: this.player.totalAnswered,
      accuracy: this.getAccuracy()
    };
  }
};

// 处理任务点击
function handleQuestClick(questId, type) {
  const quest = GameState.dailyQuests.find(q => q.id === questId);
  if (quest.completed) {
    showToast('已完成！明天再来~');
    return;
  }
  
  if (type === 'daily' || type === 'challenge') {
    const subject = type === 'challenge' ? 'random' : quest.subject;
    startQuiz(subject, null, type);
  } else if (type === 'review') {
    startQuiz('wrong', null, 'review');
  }
}

// 显示科目下的专题
function showTopics(subjectKey) {
  currentSubject = subjectKey;
  const subject = QUESTION_BANK[subjectKey];
  
  document.getElementById('app').innerHTML = `
    <div class="topics-view">
      <div class="view-header">
        <button class="back-btn" onclick="renderHome()">← 返回</button>
        <h2>${subject.icon} ${subject.name}</h2>
      </div>
      
      <div class="topic-list">
        ${Object.entries(subject.topics).map(([key, topic]) => `
          <div class="topic-item" onclick="startQuiz('${subjectKey}', '${key}', 'topic')">
            <div class="topic-icon" style="background: ${subject.color}20; color: ${subject.color}">
              📖
            </div>
            <div class="topic-info">
              <div class="topic-name">${topic.name}</div>
              <div class="topic-count">${topic.questions.length}道题</div>
            </div>
            <div class="topic-arrow">→</div>
          </div>
        `).join('')}
      </div>
    </div>
  `;
}

// 开始答题
function startQuiz(subject, topic, mode) {
  quizMode = mode;
  currentQuestions = [];
  
  if (subject === 'random') {
    // 随机抽题
    const allQuestions = [];
    Object.values(QUESTION_BANK).forEach(sub => {
      Object.values(sub.topics).forEach(t => {
        allQuestions.push(...t.questions);
      });
    });
    currentQuestions = shuffleArray([...allQuestions]).slice(0, 5);
  } else if (subject === 'wrong') {
    // 错题复习
    const wrongIds = GameState.wrongAnswers.map(w => w.id);
    if (wrongIds.length === 0) {
      showToast('暂无错题记录');
      return;
    }
    currentQuestions = findQuestionsByIds(wrongIds).slice(0, 5);
  } else if (topic) {
    // 指定专题
    currentQuestions = [...QUESTION_BANK[subject].topics[topic].questions];
  } else {
    // 指定科目，随机选一专题
    const topics = Object.keys(QUESTION_BANK[subject].topics);
    const randomTopic = topics[Math.floor(Math.random() * topics.length)];
    currentQuestions = [...QUESTION_BANK[subject].topics[randomTopic].questions];
  }
  
  if (currentQuestions.length === 0) {
    showToast('暂无题目');
    return;
  }
  
  currentQuestionIndex = 0;
  sessionCorrect = 0;
  sessionTotal = 0;
  currentView = 'quiz';
  renderQuestion();
}

// 渲染题目
function renderQuestion() {
  const q = currentQuestions[currentQuestionIndex];
  const total = currentQuestions.length;
  const progress = ((currentQuestionIndex + 1) / total) * 100;
  const subjectName = getSubjectName(q.id);
  
  document.getElementById('app').innerHTML = `
    <div class="quiz-view">
      <!-- 顶部进度 -->
      <div class="quiz-header">
        <div class="quiz-progress-info">
          <span class="quiz-number">第 ${currentQuestionIndex + 1} / ${total} 题</span>
          <span class="quiz-score">得分: ${sessionCorrect}/${sessionTotal}</span>
        </div>
        <div class="quiz-progress-bar">
          <div class="quiz-progress-fill" style="width: ${progress}%"></div>
        </div>
      </div>

      <!-- 题目内容 -->
      <div class="question-container">
        <div class="question-type-badge">${q.type === 'choice' ? '选择题' : '填空题'}</div>
        <div class="question-text">${q.question}</div>
        
        ${q.type === 'choice' ? `
          <div class="options-list">
            ${q.options.map((opt, i) => `
              <div class="option-item" onclick="selectAnswer(${i})" id="option-${i}">
                <span class="option-letter">${String.fromCharCode(65 + i)}</span>
                <span class="option-text">${opt}</span>
              </div>
            `).join('')}
          </div>
        ` : `
          <div class="input-area">
            <input type="text" id="answer-input" placeholder="请输入答案..." class="answer-input" />
            <button class="submit-btn" onclick="submitInputAnswer()">提交</button>
          </div>
        `}
      </div>

      <!-- 结果区域 -->
      <div id="result-area" class="result-area" style="display: none;"></div>
    </div>
  `;
}

// 选择答案（选择题）
function selectAnswer(index) {
  const q = currentQuestions[currentQuestionIndex];
  const correct = index === q.answer;
  showResult(correct, q.options[index], q.options[q.answer], q.explanation);
}

// 提交填空答案
function submitInputAnswer() {
  const input = document.getElementById('answer-input');
  const userAnswer = input.value.trim();
  const q = currentQuestions[currentQuestionIndex];
  
  if (!userAnswer) {
    showToast('请输入答案');
    return;
  }
  
  // 简化比较：忽略空格、大小写
  const normalizedUser = userAnswer.replace(/\s+/g, '').toLowerCase();
  const normalizedCorrect = q.answer.replace(/\s+/g, '').toLowerCase();
  const correct = normalizedUser === normalizedCorrect;
  
  showResult(correct, userAnswer, q.answer, q.explanation);
}

// 显示答题结果
function showResult(correct, userAnswer, correctAnswer, explanation) {
  sessionTotal += 1;
  if (correct) {
    sessionCorrect += 1;
  }
  
  // 记录到GameState
  const q = currentQuestions[currentQuestionIndex];
  GameState.recordAnswer(q.id, correct);
  
  // 更新任务进度
  if (quizMode === 'daily' || quizMode === 'challenge') {
    const quest = GameState.dailyQuests.find(q => q.type === quizMode);
    if (quest) {
      GameState.updateQuestProgress(quest.id, 1);
    }
  }
  
  // 显示结果
  const resultArea = document.getElementById('result-area');
  resultArea.style.display = 'block';
  resultArea.innerHTML = `
    <div class="result-card ${correct ? 'correct' : 'wrong'}">
      <div class="result-icon">${correct ? '🎉' : '😢'}</div>
      <div class="result-text">${correct ? '回答正确！' : '回答错误'}</div>
      ${!correct ? `
        <div class="answer-compare">
          <div class="your-answer">你的答案: ${userAnswer}</div>
          <div class="correct-answer">正确答案: ${correctAnswer}</div>
        </div>
      ` : ''}
      <div class="explanation">
        <strong>解析：</strong>${explanation}
      </div>
      <button class="next-btn" onclick="nextQuestion()">
        ${currentQuestionIndex < currentQuestions.length - 1 ? '下一题 →' : '查看结果'}
      </button>
    </div>
  `;
  
  // 禁用选项
  document.querySelectorAll('.option-item').forEach((opt, i) => {
    opt.style.pointerEvents = 'none';
    if (i === currentQuestions[currentQuestionIndex].answer) {
      opt.classList.add('correct-option');
    } else if (!correct && i === parseInt(document.querySelector('.option-item:hover')?.id.split('-')[1])) {
      opt.classList.add('wrong-option');
    }
  });
}

// 下一题
function nextQuestion() {
  currentQuestionIndex++;
  if (currentQuestionIndex < currentQuestions.length) {
    renderQuestion();
  } else {
    showQuizResult();
  }
}

// 显示答题结果页
function showQuizResult() {
  const accuracy = sessionTotal > 0 ? Math.round((sessionCorrect / sessionTotal) * 100) : 0;

}

// 开始复习某道错题
function startReview(questionId) {
  const q = findQuestionById(questionId);
  if (q) {
    currentQuestions = [q];
    currentQuestionIndex = 0;
    sessionCorrect = 0;
    sessionTotal = 0;
    quizMode = 'review';
    renderQuestion();
  }
}

// 辅助函数
function getSubjectIcon(subjectKey) {
  const icons = {
    chemistry: '🧪', math: '📐', chinese: '📖',
    english: '🔤', physics: '⚡', politics: '⚖️', history: '📜'
  };
  return icons[subjectKey] || '📚';
}

function getSubjectName(questionId) {
  const prefix = questionId.split('_')[0];
  const map = { ch: '化学', ma: '数学', cn: '语文', en: '英语', ph: '物理', po: '道法', hi: '历史' };
  return map[prefix] || '未知';
}

function getSubjectMastery(subjectKey) {
  // 简化：随机生成，实际应该根据答题情况计算
  return Math.min(100, Math.floor(Math.random() * 40 + 60));
}

function getWeakPoints() {
  // 简化：返回随机薄弱点
  const subjects = Object.keys(QUESTION_BANK);
  const weak = [];
  for (let i = 0; i < 3; i++) {
    const key = subjects[i];
    if (QUESTION_BANK[key]) {
      const topics = Object.keys(QUESTION_BANK[key].topics);
      const randomTopic = topics[Math.floor(Math.random() * topics.length)];
      weak.push({
        subject: key,
        topic: randomTopic,
        name: QUESTION_BANK[key].topics[randomTopic].name,
        accuracy: Math.floor(Math.random() * 30 + 40)
      });
    }
  }
  return weak;
}

function findQuestionById(id) {
  for (const subject of Object.values(QUESTION_BANK)) {
    for (const topic of Object.values(subject.topics)) {
      const q = topic.questions.find(q => q.id === id);
      if (q) return q;
    }
  }
  return null;
}

function findQuestionsByIds(ids) {
  return ids.map(id => findQuestionById(id)).filter(q => q !== null);
}

function shuffleArray(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function showToast(message) {
  const toast = document.createElement('div');
  toast.className = 'toast';
  toast.textContent = message;
  document.body.appendChild(toast);
  setTimeout(() => toast.remove(), 2000);
}

  const toast = document.createElement('div');

    <div class="achievement-toast-icon">🏆</div>

      <div class="achievement-toast-title">解锁成就：${detail.name}</div>
      <div class="achievement-toast-desc">${detail.desc}</div>
    </div>
  `;
  document.body.appendChild(toast);
  setTimeout(() => toast.remove(), 3000);
}
